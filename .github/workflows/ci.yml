# Proves that a fresh checkout behaves the same on every supported OS:
# bootstrap from the lock file, doctor, then the full test suite.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Bootstrap (Linux)
        if: runner.os != 'Windows'
        run: scripts/bootstrap.sh
      - name: Bootstrap (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/bootstrap.ps1

      - name: Doctor
        run: ${{ runner.os == 'Windows' && '.venv\Scripts\awf.exe' || '.venv/bin/awf' }} doctor

      - name: Tests
        run: ${{ runner.os == 'Windows' && '.venv\Scripts\python.exe' || '.venv/bin/python' }} -m pytest -q -p no:logging

  # The shared control plane runs on PostgreSQL: same suite against a real server, plus the
  # PostgreSQL-only checks (migrations, SQLite import, pg_dump/pg_restore) in tests/integration/test_postgres_ops.py.
  postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: awf
          POSTGRES_PASSWORD: awf-ci
          POSTGRES_DB: awf_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U awf" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AWF_TEST_DATABASE_URL: postgresql+psycopg://awf:awf-ci@127.0.0.1:5432/awf_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: PostgreSQL client tools (pg_dump/pg_restore 16)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - name: Bootstrap
        run: scripts/bootstrap.sh
      - name: Tests on PostgreSQL
        run: .venv/bin/python -m pytest -q -p no:logging --ignore=tests/unit/test_db_migrations.py
      - name: Installer scripts parse
        run: for f in scripts/*.sh; do bash -n "$f"; done
