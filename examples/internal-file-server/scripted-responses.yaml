# Scripted model responses for the InternalFileServer trial run (offline, AWF_MODEL_PROVIDER=scripted).
# The platform side is real: git clone/branches/merge, `dotnet build`, `dotnet test`, critic, gates, fix loop.
# Only the agents' "thinking" is replaced by this script. With ANTHROPIC_API_KEY set and
# `--live-model`, Claude produces this content instead.
#
# Objective: Add GET /api/health and remove the insecure "change-me" admin password fallback
#            (deletion disabled when no admin password is configured, constant-time comparison),
#            with an xUnit test project.

roles:
  product.analyst:
    - turns:
        - tool_calls:
            - {name: fs.read, input: {path: Program.cs}}
            - {name: fs.read, input: {path: README.md}}
        - submit:
            summary: Requirement for health endpoint and admin password hardening.
            outputs:
              requirement_document: |
                # Requirement: health endpoint and admin password hardening
                ## Problem
                Operators cannot check whether the file server is healthy without uploading a file, and when
                `FileServer:AdminPassword` is missing the server silently falls back to the well-known password
                `change-me`, letting anyone on the LAN delete files.
                ## Scope
                `Program.cs` minimal API, new helper classes, a new xUnit test project, README.
                ## Functional requirements
                - FR-1 `GET /api/health` returns status (`ok`/`degraded`), version, whether upload storage is writable,
                  and whether an admin password is configured.
                - FR-2 Without a configured admin password, admin login and file deletion are refused.
                - FR-3 Admin password comparison is constant-time.
                ## Non-functional requirements
                - NFR-1 Health check is cheap (one small temp file write/delete) and has no lasting side effects.
                - NFR-2 The health response must not disclose server file-system paths or secrets.
                ## Acceptance criteria
                - AC-1 `/api/health` responds 200 with the fields of FR-1.
                - AC-2 `IsAdmin` is false for any input when no password is configured.
                - AC-3 Unit tests cover AC-1 (report content) and AC-2/FR-3 (auth rules).
                - AC-4 `dotnet build` and `dotnet test` pass.
                ## Out of scope
                Rotating the password committed in `appsettings.json` (tracked separately), authentication redesign.

  engineering.solution-architect:
    - turns:
        - tool_calls:
            - {name: fs.read, input: {path: Program.cs}}
            - {name: fs.read, input: {path: InternalFileServer.csproj}}
        - submit:
            summary: Two small static helpers + test project; no new dependencies.
            outputs:
              architecture_document: |
                # Architecture: health endpoint and admin password hardening
                ## Context
                Single-project .NET 8 minimal API (`Program.cs`, top-level statements). No tests exist today.
                ## Constraints
                - Keep the single deployable; no new runtime dependencies; .NET 8.
                - The web project globs `**/*.cs`, so the test project folder must be excluded from it.
                ## Components
                - `AdminAuth` (static): `IsConfigured`, `IsAdmin` using SHA-256 + `CryptographicOperations.FixedTimeEquals`.
                - `HealthCheck` (static): `Create(uploadRoot, adminPassword, version)` -> `HealthReport` record; `IsWritable(dir)`.
                - `Program.cs`: drop the `?? "change-me"` fallback, map `GET /api/health`, delegate `IsAdmin` to `AdminAuth`,
                  add `public partial class Program` for future integration tests.
                - `tests/InternalFileServer.Tests`: xUnit project referencing the web project.
                ## Alternatives
                1. ASP.NET Core HealthChecks middleware (`AddHealthChecks`) - richer, but adds configuration surface
                   and returns a less specific payload.
                2. Static helpers + minimal endpoint (chosen).
                ## Trade-offs
                Helpers keep logic unit-testable without `WebApplicationFactory` (no extra NuGet package);
                the middleware option would be preferable once several dependencies need probing.
                ## Failure modes
                - Upload directory not writable -> `degraded`, `storageWritable=false` (HTTP 200, so load balancers can
                  read the body).
                - No admin password -> deletion returns 401; health reports `adminConfigured=false`.
                ## Security considerations
                Removes a default credential. Constant-time comparison avoids timing side channels.
                The health payload must not expose paths or secrets (unauthenticated LAN endpoint).
                ## Test strategy
                Unit tests for `AdminAuth` and `HealthCheck`; endpoint wiring verified by build + manual smoke test.
              adr: |
                # ADR-001: No default admin password
                ## Status
                Proposed
                ## Context
                A missing `FileServer:AdminPassword` falls back to `change-me`.
                ## Decision
                Treat a missing/blank password as "admin disabled"; never fall back to a default.
                ## Consequences
                Deployments without a configured password can no longer delete files until one is set
                (e.g. via environment variable `FileServer__AdminPassword`).
              component_diagram: |
                flowchart LR
                  Client --> API[Program.cs minimal API]
                  API --> AdminAuth
                  API --> HealthCheck
                  HealthCheck --> Storage[(uploads/)]

