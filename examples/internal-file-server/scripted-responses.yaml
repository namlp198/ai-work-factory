              input:
                path: AdminAuth.cs
                content: |
                  using System.Security.Cryptography;
                  using System.Text;

                  namespace InternalFileServer;

                  /// <summary>Admin password rules. Admin features are disabled when no password is configured.</summary>
                  public static class AdminAuth
                  {
                      public static bool IsConfigured(string? adminPassword) => !string.IsNullOrWhiteSpace(adminPassword);

                      /// <summary>Constant-time comparison of the supplied password with the configured one.</summary>
                      public static bool IsAdmin(string? password, string? adminPassword)
                      {
                          if (!IsConfigured(adminPassword) || string.IsNullOrEmpty(password))
                          {
                              return false;
                          }

                          var given = SHA256.HashData(Encoding.UTF8.GetBytes(password));
                          var expected = SHA256.HashData(Encoding.UTF8.GetBytes(adminPassword!));
                          return CryptographicOperations.FixedTimeEquals(given, expected);
                      }
                  }
            - name: fs.write
              input:
                path: HealthCheck.cs
                content: |
                  namespace InternalFileServer;

                  public sealed record HealthReport(
                      string Status,
                      string Version,
                      bool StorageWritable,
                      bool AdminConfigured,
                      string StoragePath,
                      DateTimeOffset CheckedAt);

                  /// <summary>Cheap readiness probe for the file server.</summary>
                  public static class HealthCheck
                  {
                      public static HealthReport Create(string uploadRoot, string? adminPassword, string version)
                      {
                          var writable = IsWritable(uploadRoot);
                          return new HealthReport(
                              writable ? "ok" : "degraded",
                              version,
                              writable,
                              AdminAuth.IsConfigured(adminPassword),
                              uploadRoot,
                              DateTimeOffset.UtcNow);
                      }

                      public static bool IsWritable(string directory)
                      {
                          try
                          {
                              Directory.CreateDirectory(directory);
                              var probe = Path.Combine(directory, $".health-{Guid.NewGuid():N}.tmp");
                              File.WriteAllText(probe, "ok");
                              File.Delete(probe);
                              return true;
                          }
                          catch (Exception ex) when (ex is IOException or UnauthorizedAccessException)
                          {
                              return false;
                          }
                      }
                  }
