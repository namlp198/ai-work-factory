                  using InternalFileServer;
                  using Xunit;

                  namespace InternalFileServer.Tests;

                  public class AdminAuthTests
                  {
                      [Theory]
                      [InlineData(null)]
                      [InlineData("")]
                      [InlineData("   ")]
                      public void Admin_is_disabled_without_configured_password(string? configured)
                      {
                          Assert.False(AdminAuth.IsConfigured(configured));
                          Assert.False(AdminAuth.IsAdmin("change-me", configured));
                          Assert.False(AdminAuth.IsAdmin("", configured));
                      }

                      [Fact]
                      public void Correct_password_is_accepted()
