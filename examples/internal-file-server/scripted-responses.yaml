            - name: fs.write
              input:
                path: tests/InternalFileServer.Tests/HealthCheckTests.cs
                content: |
                  using InternalFileServer;
                  using Xunit;

                  namespace InternalFileServer.Tests;

                  public class HealthCheckTests : IDisposable
                  {
                      private readonly string _root = Path.Combine(Path.GetTempPath(), $"ifs-health-{Guid.NewGuid():N}");

                      [Fact]
                      public void Writable_storage_reports_ok()
                      {
                          var report = HealthCheck.Create(_root, "pw-123456", "1.0.0");

                          Assert.Equal("ok", report.Status);
                          Assert.True(report.StorageWritable);
                          Assert.True(report.AdminConfigured);
                          Assert.Equal("1.0.0", report.Version);
                          Assert.Empty(Directory.EnumerateFiles(_root)); // probe file cleaned up
                      }

                      [Fact]
                      public void Missing_admin_password_is_reported()
                      {
                          Assert.False(HealthCheck.Create(_root, null, "1.0.0").AdminConfigured);
                      }

                      [Fact]
                      public void Unwritable_storage_reports_degraded()
                      {
                          // A path below an existing *file* can never be created as a directory.
                          Directory.CreateDirectory(_root);
                          var file = Path.Combine(_root, "not-a-dir");
                          File.WriteAllText(file, "x");

                          var report = HealthCheck.Create(Path.Combine(file, "uploads"), "pw-123456", "1.0.0");

                          Assert.Equal("degraded", report.Status);
                          Assert.False(report.StorageWritable);
                      }

                      public void Dispose()
                      {
                          if (Directory.Exists(_root))
                          {
                              Directory.Delete(_root, recursive: true);
                          }
                      }
                  }
