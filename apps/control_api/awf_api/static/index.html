<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Work Factory</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1f26" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AWF">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>
<header>
  <div class="brand">AI Work Factory</div>
  <nav>
    <a href="#/" data-nav="overview" data-i18n="nav.overview">Overview</a>
    <a href="#/projects" data-nav="projects" data-i18n="nav.projects">Projects</a>
    <a href="#/approvals" data-nav="approvals"><span data-i18n="nav.approvals">Approvals</span> <span id="approval-badge" class="badge hidden"></span></a>
    <a href="#/workers" data-nav="workers" data-i18n="nav.workers">Workers</a>
    <a href="#/notifications" data-nav="notifications" data-i18n="nav.notifications">Notifications</a>
    <a href="#/agents" data-nav="agents" data-i18n="nav.agents">Agents</a>
    <a href="#/audit" data-nav="audit" data-i18n="nav.audit">Audit</a>
  </nav>
  <select id="lang-select" class="lang-select" aria-label="Language"></select>
  <button id="logout-btn" class="ghost hidden" data-i18n="header.logout" data-i18n-title="header.logout_title">Logout</button>
</header>
<div id="offline" class="banner hidden" data-i18n="offline.banner">Connection to the server lost: showing the last data, retrying…</div>
<main id="view"><p class="muted" data-i18n="common.loading">Loading…</p></main>
<div id="drawer" class="drawer hidden"><div class="drawer-inner"><button class="ghost close" id="drawer-close" data-i18n="common.close">Close</button><div id="drawer-body"></div></div></div>
<script src="/static/i18n.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
