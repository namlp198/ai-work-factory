[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-work-factory"
version = "0.1.0"
description = "AI Work Factory - artifact-driven multi-agent workflow platform (Phase 0-1 MVP)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "jsonschema>=4.21",
    "anthropic>=1.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
s3 = ["boto3>=1.34"]
dev = ["pytest>=8"]

[project.scripts]
awf = "awf.cli:main"

[tool.setuptools.packages.find]
where = ["packages", "apps/control_api", "workers/linux_worker"]

[tool.setuptools.package-data]
awf_api = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages", "apps/control_api", "workers/linux_worker"]
markers = [
    "e2e: end-to-end scenario through API + worker + git",
]
