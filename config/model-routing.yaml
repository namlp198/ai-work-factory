# Model Router configuration (Implementation Plan §12).
# A profile declares a model class; this file maps the class to a provider/model.
# Override the provider globally with AWF_MODEL_PROVIDER=scripted for offline runs.

# Spend where thinking pays (ADR-015): the strong model only for architecture and planning, at medium effort;
# code, tests, review and QA on the balanced model. Harder work climbs through `escalation` below.
#   role                         class            normal              hard          very hard
#   architect, planner           REASONING        opus-5-5 medium     opus high     opus xhigh
#   developer                    CODE_SPECIALIST  sonnet-5-5 medium   sonnet high   opus high
#   reviewer, analyst, QA, tests BALANCED         sonnet-5-5 medium   sonnet high   opus high
classes:
  FAST:
    provider: anthropic
    model: claude-haiku-4-5
  BALANCED:
    provider: anthropic
    model: claude-sonnet-5-5
    effort: medium
  REASONING:
    provider: anthropic
    model: claude-opus-5-5
    effort: medium
  CODE_SPECIALIST:
    provider: anthropic
    model: claude-sonnet-5-5
    effort: medium
  MULTIMODAL:
    provider: anthropic
    model: claude-opus-5-5
    effort: medium
  LOCAL_PRIVATE:
    # No local model is wired in the MVP. Sensitive projects are routed here and
    # the job fails fast instead of leaking code to a hosted model.
    provider: unavailable
    model: none

# The provider a run uses when neither the run (inputs "llm") nor the project (labels.llm) chooses one.
default_provider: anthropic

# How hard the work is: a run picks normal / hard / very hard ("Complexity" in the dashboard, default normal), and a
# task that a reviewer, the Critic or a human sent back climbs one level by itself (max very hard).
#   hard:      effort one rung up the ladder;
#   very hard: the class in `promote` (strong model) one rung up, or two rungs for a class not promoted.
# Effort never goes above the provider's highest rung (`max_effort`, default the top of the ladder).
escalation:
  effort_ladder: [low, medium, high, xhigh]
  # Efforts that wait for a human: before a task runs at one of these (any model, any role), the run asks
  # `approve_effort` (dashboard Approvals, Telegram...). Approved: it runs as routed. Rejected: it runs at the
  # highest effort below these (medium), and the run goes on.
  approval_required: [high, xhigh]
  promote: {FAST: BALANCED, BALANCED: REASONING, CODE_SPECIALIST: REASONING}
  max_effort: {google: high}

# The same classes on other providers. A run with llm=google maps every class through this table instead of
# `classes` above. LOCAL_PRIVATE is never remapped.
providers:
  google:
    FAST:
      model: gemini-3.5-flash-lite
      effort: low
    BALANCED:
      model: gemini-3.8-flash
      effort: medium
    REASONING:
      model: gemini-4-argon
      effort: medium
    CODE_SPECIALIST:
      model: gemini-3.8-flash
      effort: medium
    MULTIMODAL:
      model: gemini-3.8-flash
      effort: medium

  # ChatGPT models (OpenAI Responses API). gpt-6.1-sol is also the model Codex recommends for coding; switch
  # REASONING to gpt-6-astra (5x the price) for the hardest architecture/review work.
  openai:
    FAST:
      model: gpt-6-luna
      effort: low
    BALANCED:
      model: gpt-6.1-sol
      effort: low
    REASONING:
      model: gpt-6.1-sol
      effort: medium
    CODE_SPECIALIST:
      model: gpt-6.1-sol
      effort: medium
    MULTIMODAL:
      model: gpt-6.1-sol
      effort: medium

  # The four providers below speak OpenAI-compatible Chat Completions (ADR-013). `extra` is merged into the request
  # body as is: use it for provider switches such as thinking or reasoning effort. Model IDs as of October 2026;
  # check each provider's model list before changing them.
  qwen:          # Alibaba Cloud Model Studio (DashScope), international endpoint
    FAST:
      model: qwen3.8-flash
    BALANCED:
      model: qwen3.7-plus
    REASONING:
      model: qwen3.8-max
    CODE_SPECIALIST:
      model: qwen3.8-max
    MULTIMODAL:
      model: qwen3.7-plus
  kimi:          # Moonshot AI (Kimi). The K2 series retires at the end of December 2026: K3 models only.
    FAST:
      model: kimi-k3
    BALANCED:
      model: kimi-k3
    REASONING:
      model: kimi-k3.1-pro
    CODE_SPECIALIST:
      model: kimi-k3.1-pro
    MULTIMODAL:
      model: kimi-k3
  # Thinking on at DeepSeek's default effort: a `reasoning_effort: high` here would make every task wait for
  # approval (escalation.approval_required), and escalation does not change `extra`.
  deepseek:
    FAST:
      model: deepseek-flash
    BALANCED:
      model: deepseek-flash
      extra: {thinking: {type: enabled}}
    REASONING:
      model: deepseek-v4-pro
      extra: {thinking: {type: enabled}}
    CODE_SPECIALIST:
      model: deepseek-v4-pro
      extra: {thinking: {type: enabled}}
    MULTIMODAL:
      model: deepseek-flash
  minimax:
    FAST:
      model: MiniMax-M3
    BALANCED:
      model: MiniMax-M3
    REASONING:
      model: MiniMax-M3
    CODE_SPECIALIST:
      model: MiniMax-M3
    MULTIMODAL:
      model: MiniMax-M3

# Task-type overrides applied before the profile's own class.
task_type_rules:
  log_summarization: FAST
  rename_refactor: FAST
  unit_test_generation: BALANCED

# Projects with confidentiality "restricted" are forced to this class.
confidential_class: LOCAL_PRIVATE

# When a project's remaining budget (USD) drops below this, downgrade one step.
budget_downgrade_threshold_usd: 1.0
downgrade_chain: [REASONING, CODE_SPECIALIST, BALANCED, FAST]

# USD per 1M tokens, used for cost estimates on agent runs.
pricing:
  claude-opus-5-5: {input: 4.00, output: 20.00}
  claude-sonnet-5-5: {input: 2.00, output: 10.00}
  claude-haiku-4-5: {input: 1.00, output: 5.00}
  # Gemini output prices include thinking tokens. Google raises 4 Argon to 4/20 on 2026-12-01 and
  # 3.8 Flash to 1.50/7.50 on 2027-01-01: update these lines then.
  gemini-4-argon: {input: 2.00, output: 10.00}
  gemini-3.8-flash: {input: 0.75, output: 3.75}
  gemini-3.5-flash-lite: {input: 0.30, output: 2.50}
  # OpenAI prices (October 2026); reasoning tokens are billed as output.
  gpt-6-astra: {input: 10.00, output: 50.00}
  gpt-6.1-sol: {input: 2.00, output: 10.00}
  gpt-6-luna: {input: 0.10, output: 0.50}
  # Qwen, international (Singapore) rates; qwen3.7-plus up to 256K input (above: 1.20 / 4.80).
  qwen3.8-max: {input: 2.00, output: 6.00}
  qwen3.7-plus: {input: 0.40, output: 1.60}
  qwen3.8-flash: {input: 0.15, output: 0.47}
  # DeepSeek peak-hour rates (off-peak is half). deepseek-flash output at peak is not published: 2x off-peak.
  deepseek-v4-pro: {input: 1.32, output: 3.96}
  deepseek-flash: {input: 0.30, output: 1.20}
  # MiniMax standard tier, input up to 512K tokens (above: 0.60 / 2.40).
  MiniMax-M3: {input: 0.30, output: 1.20}
  # Kimi K3 prices were not published in a form we could verify: add them here (USD per 1M tokens) to get
  # cost estimates for Kimi runs; until then they show $0.
  scripted: {input: 0.0, output: 0.0}
